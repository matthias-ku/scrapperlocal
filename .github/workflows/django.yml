name: Django CI/CD Docker

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master
  workflow_dispatch:    # Allows manual trigger via the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4

    services:
      db:
        image: postgres
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    
    steps:
    # 1. Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    # 3. Install dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Create env file
      run: |
        touch .env
        echo DB_NAME="postgres" >> .env
        echo POSTGRES_USER="postgres" >> .env
        echo POSTGRES_PASSWORD="postgres" >> .env
        echo SENTRY_DSN="https://ee072512232cdec772c5ac4a3569d7e1@o4510414210400256.ingest.de.sentry.io/4510414297628752" >> .env
        cat .env

    # 4. Run tests
    - name: Run Tests
      run: |
        coverage run manage.py test --keepdb
        coverage report -m      

    # 5. Run mutation tests
    - name: Mutation Tests
      run: |
        cosmic-ray init cosmic-ray.toml cosmic-ray.sqlite
        cosmic-ray --verbosity=INFO baseline cosmic-ray.toml
        cosmic-ray exec cosmic-ray.toml cosmic-ray.sqlite
        cr-html cosmic-ray.sqlite > report.html
